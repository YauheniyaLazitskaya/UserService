version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
      - redis-cache

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: paycard_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis-cache:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data: